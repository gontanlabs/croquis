# Integración continua de la plantilla común: el mismo comando que en local, más un escáner de secretos.
# En repos privados del plan gratuito, GitHub no busca secretos: gitleaks es la barrera.
name: comprobar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        if: hashFiles('package.json') != ''
        with:
          node-version: 24
      - name: Dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci; fi
          pip install -r requirements-ci.txt
      - name: scripts/comprobar.py
        run: python scripts/comprobar.py

  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (todo el historial)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .
