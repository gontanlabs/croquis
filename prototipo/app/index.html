<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1d21">
<title>Croquis</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<!-- Inicio -->
<section id="inicio" class="pantalla activa">
  <h1>Croquis</h1>
  <p class="sub">Estado actual de una vivienda</p>
  <label class="campo">Nombre del levantamiento
    <input id="nombre" type="text" value="Mi casa" autocomplete="off">
  </label>
  <button id="b-escanear" class="grande accion">Escanear la casa</button>
  <p id="e-pendientes" class="nota"></p>
  <details class="nota"><summary>Otras pruebas</summary>
    <button id="b-ar" class="grande secundario">Recorrer marcando esquinas</button>
    <button id="b-giro" class="grande secundario">Girar en el centro (profundidad)</button>
  </details>
  <button id="b-dibujar" class="grande secundario">Dibujar el croquis a mano</button>
  <div id="seguir"></div>
  <p id="aviso-ar" class="nota"></p>
</section>

<!-- Recorrido (cámara o dibujo) -->
<section id="recorrido" class="pantalla">
  <canvas id="lienzo"></canvas>
  <div id="cruz" hidden></div>
  <div class="barra-arriba">
    <span id="estado">Elige una estancia</span>
  </div>
  <div id="chips" class="chips"></div>
  <div class="barra-abajo">
    <button id="b-esquina" class="accion">Esquina</button>
    <button id="b-cerrar">Cerrar estancia</button>
    <button id="b-puerta">Puerta</button>
    <button id="b-ventana">Ventana</button>
    <button id="b-deshacer">Deshacer</button>
    <button id="b-terminar" class="fin">Terminar</button>
  </div>
</section>

<!-- Escaneo guiado: fotos 360 desde uno o dos puntos por habitación -->
<section id="escaneo" class="pantalla">
  <canvas id="e-lienzo"></canvas>
  <canvas id="e-mapa"></canvas>
  <div class="barra-arriba"><span id="e-estado">¿En qué habitación empiezas?</span><br><small id="e-cuenta"></small></div>
  <div id="e-chips" class="chips"></div>
  <div class="barra-abajo">
    <button id="e-punto">Segundo punto</button>
    <button id="e-habitacion">Otra habitación</button>
    <button id="e-terminar" class="fin">Terminar</button>
  </div>
</section>

<!-- Giro en el centro: profundidad de la cámara -->
<section id="giro" class="pantalla">
  <div class="barra-arriba"><span id="g-estado">Ponte en el centro de la habitación</span></div>
  <canvas id="g-anillo"></canvas>
  <div class="barra-abajo dos">
    <button id="g-empezar" class="accion">Empezar a girar</button>
    <button id="g-terminar" class="fin">Terminar</button>
  </div>
</section>
<section id="resultado" class="pantalla">
  <canvas id="r-plano"></canvas>
  <div class="tarjeta">
    <h2 id="r-titulo"></h2>
    <p id="r-detalle" class="nota"></p>
    <button id="r-otra" class="grande secundario">Probar otra habitación</button>
  </div>
</section>

<!-- Medir -->
<section id="medir" class="pantalla">
  <canvas id="plano"></canvas>
  <div class="tarjeta">
    <div class="progreso"><span id="cuenta"></span><span id="margen"></span></div>
    <h2 id="t-texto"></h2>
    <p id="t-ayuda" class="nota"></p>
    <div id="t-entrada">
      <input id="valor" type="text" inputmode="decimal" placeholder="0,000" autocomplete="off">
      <span class="unidad">m</span>
      <div class="modos">
        <button data-modo="laser" class="modo">Láser</button>
        <button data-modo="cinta" class="modo">Cinta</button>
      </div>
    </div>
    <div id="t-opciones"></div>
    <div id="sospechas" class="alerta" hidden></div>
    <div class="botones">
      <button id="b-saltar" class="secundario">Saltar</button>
      <button id="b-guardar" class="accion">Guardar</button>
    </div>
    <button id="b-planos" class="grande secundario">Sacar los planos</button>
    <div id="pdfs"></div>
  </div>
</section>

<div id="ocupado" hidden><div>Calculando…</div></div>
<script src="app.js"></script>
<script src="escaneo.js"></script>
</body>
</html>
